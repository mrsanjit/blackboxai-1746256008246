<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Twitter Clone - Timeline</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">
  <header class="bg-white shadow p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">Twitter Clone</h1>
    <button id="logout-btn" class="text-red-500 hover:underline">Logout</button>
  </header>
  <main class="flex-grow max-w-2xl mx-auto p-4">
    <section class="mb-6">
      <form id="tweet-form" class="flex space-x-2">
        <input type="text" id="tweet-content" maxlength="280" placeholder="What's happening?" class="flex-grow rounded border border-gray-300 p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />
        <button type="submit" class="bg-blue-500 text-white px-4 rounded hover:bg-blue-600 transition">Tweet</button>
      </form>
    </section>
    <section id="timeline" class="space-y-4">
      <!-- Tweets will be appended here -->
    </section>
  </main>

  <script>
    const token = localStorage.getItem('token');
    if (!token) {
      window.location.href = 'index.html';
    }

    const timelineEl = document.getElementById('timeline');
    const tweetForm = document.getElementById('tweet-form');
    const tweetContent = document.getElementById('tweet-content');
    const logoutBtn = document.getElementById('logout-btn');

    async function fetchTimeline() {
      try {
        const res = await fetch('http://localhost:3000/timeline', {
          headers: { 'Authorization': token }
        });
        if (!res.ok) throw new Error('Failed to fetch timeline');
        const tweets = await res.json();
        timelineEl.innerHTML = '';
        tweets.forEach(tweet => {
          const tweetEl = document.createElement('div');
          tweetEl.className = 'bg-white p-4 rounded shadow';
          tweetEl.innerHTML = `
            <div class="flex items-center space-x-2 mb-2">
              <i class="fas fa-user-circle text-2xl text-gray-600"></i>
              <a href="profile.html?username=${tweet.username}" class="font-semibold text-blue-600 hover:underline">${tweet.username}</a>
              <span class="text-gray-500 text-sm">${new Date(tweet.timestamp).toLocaleString()}</span>
            </div>
            <p class="text-gray-800">${tweet.content}</p>
          `;
          timelineEl.appendChild(tweetEl);
        });
      } catch (err) {
        timelineEl.innerHTML = '<p class="text-red-500">Error loading timeline.</p>';
      }
    }

    tweetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = tweetContent.value.trim();
      if (!content) return;
      try {
        const res = await fetch('http://localhost:3000/tweet', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': token },
          body: JSON.stringify({ content })
        });
        if (!res.ok) throw new Error('Failed to post tweet');
        tweetContent.value = '';
        fetchTimeline();
      } catch (err) {
        alert('Error posting tweet');
      }
    });

    logoutBtn.addEventListener('click', async () => {
      try {
        await fetch('http://localhost:3000/logout', {
          method: 'POST',
          headers: { 'Authorization': token }
        });
      } catch (err) {
        // ignore errors on logout
      }
      localStorage.removeItem('token');
      localStorage.removeItem('username');
      window.location.href = 'index.html';
    });

    fetchTimeline();
  </script>
</body>
</html>
