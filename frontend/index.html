<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Twitter Clone - Login / Signup</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded shadow-md w-full max-w-md">
    <h1 class="text-3xl font-bold mb-6 text-center">Twitter Clone</h1>
    <div id="form-container">
      <form id="login-form" class="space-y-4">
        <div>
          <label for="login-username" class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="login-username" required class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
        </div>
        <div>
          <label for="login-password" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="login-password" required class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:border-blue-500 focus:ring focus:ring-blue-200 focus:ring-opacity-50" />
        </div>
        <button type="submit" class="w-full bg-blue-500 text-white py-2 rounded hover:bg-blue-600 transition">Login</button>
      </form>
      <form id="signup-form" class="space-y-4 hidden">
        <div>
          <label for="signup-username" class="block text-sm font-medium text-gray-700">Username</label>
          <input type="text" id="signup-username" required class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:border-green-500 focus:ring focus:ring-green-200 focus:ring-opacity-50" />
        </div>
        <div>
          <label for="signup-password" class="block text-sm font-medium text-gray-700">Password</label>
          <input type="password" id="signup-password" required class="mt-1 block w-full rounded border-gray-300 shadow-sm focus:border-green-500 focus:ring focus:ring-green-200 focus:ring-opacity-50" />
        </div>
        <button type="submit" class="w-full bg-green-500 text-white py-2 rounded hover:bg-green-600 transition">Sign Up</button>
      </form>
    </div>
    <p class="mt-4 text-center text-sm text-gray-600">
      <span id="toggle-text">Don't have an account?</span>
      <button id="toggle-btn" class="text-blue-500 hover:underline ml-1">Sign Up</button>
    </p>
    <p id="message" class="mt-4 text-center text-red-500"></p>
  </div>

  <script>
    const loginForm = document.getElementById('login-form');
    const signupForm = document.getElementById('signup-form');
    const toggleBtn = document.getElementById('toggle-btn');
    const toggleText = document.getElementById('toggle-text');
    const messageEl = document.getElementById('message');

    toggleBtn.addEventListener('click', () => {
      if (loginForm.classList.contains('hidden')) {
        loginForm.classList.remove('hidden');
        signupForm.classList.add('hidden');
        toggleText.textContent = "Don't have an account?";
        toggleBtn.textContent = "Sign Up";
        messageEl.textContent = '';
      } else {
        loginForm.classList.add('hidden');
        signupForm.classList.remove('hidden');
        toggleText.textContent = "Already have an account?";
        toggleBtn.textContent = "Login";
        messageEl.textContent = '';
      }
    });

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.textContent = '';
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value.trim();
      try {
        const res = await fetch('http://localhost:3000/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (res.ok) {
          localStorage.setItem('token', data.token);
          localStorage.setItem('username', data.username);
          window.location.href = 'timeline.html';
        } else {
          messageEl.textContent = data.error || 'Login failed';
        }
      } catch (err) {
        messageEl.textContent = 'Error connecting to server';
      }
    });

    signupForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageEl.textContent = '';
      const username = document.getElementById('signup-username').value.trim();
      const password = document.getElementById('signup-password').value.trim();
      try {
        const res = await fetch('http://localhost:3000/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();
        if (res.ok) {
          messageEl.style.color = 'green';
          messageEl.textContent = 'User created. Please login.';
          toggleBtn.click();
        } else {
          messageEl.textContent = data.error || 'Signup failed';
        }
      } catch (err) {
        messageEl.textContent = 'Error connecting to server';
      }
    });
  </script>
</body>
</html>
